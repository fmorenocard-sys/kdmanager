<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kingdom Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132036"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.40" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="118" fill="url(#glow)"/>
  <rect x="7.5" y="7.5" width="497" height="497" rx="116.5" fill="none" stroke="#f59e0b" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Crown built from ascending "chart" bars -->
  <g>
    <!-- band -->
    <rect x="150" y="322" width="212" height="46" rx="13" fill="url(#gold)"/>
    <!-- peaks / bars -->
    <rect x="168" y="250" width="52" height="90" rx="13" fill="url(#gold)"/>
    <rect x="230" y="190" width="52" height="150" rx="13" fill="url(#gold)"/>
    <rect x="292" y="250" width="52" height="90" rx="13" fill="url(#gold)"/>
    <!-- jewels -->
    <circle cx="194" cy="244" r="15" fill="#fbbf24"/>
    <circle cx="256" cy="184" r="18" fill="#818cf8"/>
    <circle cx="318" cy="244" r="15" fill="#fbbf24"/>
    <!-- dashboard baseline -->
    <rect x="150" y="380" width="212" height="8" rx="4" fill="#6366f1" fill-opacity="0.85"/>
  </g>
</svg>
